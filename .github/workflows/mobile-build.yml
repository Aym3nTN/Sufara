name: Mobile build (EAS)

# Fires two ways:
#
# 1. Automatically on every push to main that touches the mobile app, so the
#    latest code always has a fresh preview APK waiting on Expo. Uses fixed
#    settings (android / preview / no wait / no submit) since a push has no
#    interactive inputs.
# 2. Manually via workflow_dispatch when you need a different platform, an
#    AAB, or a store submission.
#
# Concurrency is grouped so several fast pushes fold into one build slot.

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-build.yml'
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build'
        type: choice
        options: [android, ios, all]
        default: android
      profile:
        description: 'eas.json profile — preview produces an installable APK, production an AAB/IPA for the stores'
        type: choice
        options: [preview, production]
        default: preview
      wait:
        description: 'Wait for the build to finish (uses runner minutes, but surfaces build failures here)'
        type: boolean
        default: false
      submit:
        description: 'Submit to the store after building (production profile only)'
        type: boolean
        default: false

concurrency:
  # Coalesce rapid pushes so we don't queue N build slots for N commits.
  group: mobile-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: eas build (${{ inputs.platform || 'android' }} / ${{ inputs.profile || 'preview' }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    env:
      # workflow_dispatch inputs are empty strings on push events, so || picks
      # the fallback. These are the only values referenced below.
      PLATFORM: ${{ inputs.platform || 'android' }}
      PROFILE: ${{ inputs.profile || 'preview' }}
      SHOULD_WAIT: ${{ inputs.wait || 'false' }}
      SHOULD_SUBMIT: ${{ inputs.submit || 'false' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Set up EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: npm ci

      - name: Check the build is pointed at a real API
        run: |
          URL=$(node -e "const c=require('./eas.json');process.stdout.write(c.build['${PROFILE}'].env.EXPO_PUBLIC_API_URL||'')")
          echo "EXPO_PUBLIC_API_URL for '${PROFILE}': ${URL:-<unset>}"
          if [ -z "${URL}" ]; then
            echo "::error::eas.json has no EXPO_PUBLIC_API_URL for this profile. A standalone build would point at localhost and reach nothing."
            exit 1
          fi
          case "${URL}" in
            *sufara-api.onrender.com*)
              echo "::warning::eas.json still holds the placeholder Render URL. Replace it with your deployed API before shipping this build to anyone."
              ;;
          esac

      - name: Build
        env:
          # Consumed by app.config.ts so the CLI knows which EAS project this is.
          EAS_PROJECT_ID: ${{ vars.EAS_PROJECT_ID }}
        run: |
          WAIT_FLAG="--no-wait"
          if [ "${SHOULD_WAIT}" = "true" ]; then WAIT_FLAG="--wait"; fi
          eas build \
            --platform "${PLATFORM}" \
            --profile "${PROFILE}" \
            --non-interactive \
            ${WAIT_FLAG}

      - name: Submit to store
        if: env.SHOULD_SUBMIT == 'true' && env.PROFILE == 'production'
        env:
          EAS_PROJECT_ID: ${{ vars.EAS_PROJECT_ID }}
        run: eas submit --platform "${PLATFORM}" --profile production --non-interactive --latest

      - name: Where to find the build
        run: |
          {
            echo "### EAS build requested"
            echo ""
            echo "Platform: \`${PLATFORM}\` · Profile: \`${PROFILE}\`"
            echo ""
            echo "Download it from <https://expo.dev/accounts/[your-account]/projects/sufara/builds> — the \`preview\` profile produces an APK you can install directly."
          } >> "$GITHUB_STEP_SUMMARY"
