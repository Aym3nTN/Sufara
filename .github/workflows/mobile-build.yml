name: Mobile build (APK)

# Builds a standalone release APK on the GitHub-hosted runner using
# expo prebuild + Gradle — no EAS cloud builds, no monthly limits.
# assembleRelease bundles the JS into the APK (no Metro/dev server needed
# at runtime) and Expo's default template signs it with the debug
# keystore, so it installs and runs standalone.
# On success, publishes a GitHub Release with the APK attached.

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-build.yml'
  workflow_dispatch:

permissions:
  contents: write   # required to create GitHub Releases

concurrency:
  group: mobile-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK (release)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android SDK licences
        run: yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

      - name: Install JS dependencies
        run: npm ci

      - name: Expo prebuild — generate Android native project
        env:
          EAS_PROJECT_ID: ${{ vars.EAS_PROJECT_ID }}
          EXPO_PUBLIC_API_URL: https://sufara-api-0a1u.onrender.com/api/v1
        run: npx expo prebuild --platform android --no-install

      # Expo's generated app/build.gradle already points the `release`
      # buildType at signingConfigs.debug out of the box (the standard
      # convention for CI/test builds without a production keystore), so
      # no manual signing setup is needed here.

      - name: Build release APK
        working-directory: mobile/android
        env:
          # The Gradle bundling task spawns the Metro/expo-export bundler
          # as a subprocess — it needs this in its environment (not just at
          # prebuild time) for EXPO_PUBLIC_* to be inlined into the JS bundle.
          EXPO_PUBLIC_API_URL: https://sufara-api-0a1u.onrender.com/api/v1
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon -x test

      - name: Locate APK and set outputs
        id: apk
        run: |
          APK=$(find android/app/build/outputs/apk/release -name "*.apk" | head -1)
          if [ -z "${APK}" ]; then
            echo "::error::No APK found after build"
            exit 1
          fi
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          DATE=$(date +%Y%m%d)
          echo "path=${APK}" >> "$GITHUB_OUTPUT"
          echo "tag=v1.0-${DATE}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "title=Sufara Android ${DATE} (${SHORT_SHA})" >> "$GITHUB_OUTPUT"
          echo "Built APK: ${APK}"

      - name: Create GitHub Release and upload APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NOTES="## Sufara Android APK

          Standalone release APK — sideload on any Android device.

          **Install steps:**
          1. Download \`sufara.apk\` below
          2. Open it on your Android device
          3. If prompted, enable *Install from unknown sources* for your browser/Files app
          4. Tap Install

          | | |
          |---|---|
          | **API** | https://sufara-api-0a1u.onrender.com/api/v1 |
          | **Commit** | \`${{ github.sha }}\` |
          | **Built** | $(date -u +'%Y-%m-%d %H:%M UTC') |"

          gh release create "${{ steps.apk.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --title "${{ steps.apk.outputs.title }}" \
            --notes "${NOTES}" \
            --latest \
            "${{ steps.apk.outputs.path }}#sufara.apk"

          RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/${{ steps.apk.outputs.tag }}"
          echo "✅ GitHub Release: ${RELEASE_URL}"
          {
            echo "## 📱 APK ready"
            echo ""
            echo "**[⬇️ Download sufara.apk](${RELEASE_URL})**"
            echo ""
            echo "Standalone release build — no dev server needed."
          } >> "$GITHUB_STEP_SUMMARY"
