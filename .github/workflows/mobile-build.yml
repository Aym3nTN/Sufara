name: Mobile build (APK)

# Builds the Android APK directly on the GitHub-hosted runner using
# expo prebuild + Gradle — no EAS cloud builds, no monthly limits.
# On success, publishes a GitHub Release with the APK attached.
#
# Fires on every push to main that touches the mobile app, and on-demand
# via workflow_dispatch.

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-build.yml'
  workflow_dispatch:

permissions:
  contents: write   # required to create GitHub Releases

concurrency:
  group: mobile-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android SDK licences
        run: yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

      - name: Install JS dependencies
        run: npm ci

      - name: Verify API URL is baked in
        run: |
          URL=$(node -e "const c=require('./eas.json');process.stdout.write(c.build.preview.env.EXPO_PUBLIC_API_URL||'')")
          echo "EXPO_PUBLIC_API_URL: ${URL:-<unset>}"
          if [ -z "${URL}" ]; then
            echo "::error::eas.json preview profile has no EXPO_PUBLIC_API_URL"
            exit 1
          fi

      - name: Expo prebuild — generate Android native project
        env:
          EAS_PROJECT_ID: ${{ vars.EAS_PROJECT_ID }}
          EXPO_PUBLIC_API_URL: https://sufara-api-0a1u.onrender.com/api/v1
        run: npx expo prebuild --platform android --no-install

      - name: Build debug APK
        working-directory: mobile/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon -x test

      - name: Locate APK and set outputs
        id: apk
        run: |
          APK=$(find android/app/build/outputs/apk/debug -name "*.apk" | head -1)
          if [ -z "${APK}" ]; then
            echo "::error::No APK found after build"
            exit 1
          fi
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          DATE=$(date +%Y%m%d)
          echo "path=${APK}" >> "$GITHUB_OUTPUT"
          echo "tag=v1.0-${DATE}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "title=Sufara Android ${DATE} (${SHORT_SHA})" >> "$GITHUB_OUTPUT"
          echo "Built APK at: ${APK}"

      - name: Create GitHub Release and upload APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NOTES="## Sufara Android APK

          Sideload on any Android device — enable **Install from unknown sources** first.

          | | |
          |---|---|
          | **API** | https://sufara-api-0a1u.onrender.com/api/v1 |
          | **Commit** | \`${{ github.sha }}\` |
          | **Built** | $(date -u +'%Y-%m-%d %H:%M UTC') |"

          gh release create "${{ steps.apk.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --title "${{ steps.apk.outputs.title }}" \
            --notes "${NOTES}" \
            --latest \
            "${{ steps.apk.outputs.path }}#sufara.apk"

          RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/${{ steps.apk.outputs.tag }}"
          echo "✅ GitHub Release: ${RELEASE_URL}"

          {
            echo "## 📱 APK ready to install"
            echo ""
            echo "**[⬇️ Download sufara.apk](${RELEASE_URL})**"
            echo ""
            echo "Enable *Install from unknown sources* on your Android device, then open the file."
          } >> "$GITHUB_STEP_SUMMARY"
