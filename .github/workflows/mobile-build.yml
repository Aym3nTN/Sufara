name: Mobile build (EAS)

# Manual on purpose: every run consumes an EAS build slot, and a build is only
# useful once the API it points at is deployed.

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build'
        type: choice
        options: [android, ios, all]
        default: android
      profile:
        description: 'eas.json profile — preview produces an installable APK, production an AAB/IPA for the stores'
        type: choice
        options: [preview, production]
        default: preview
      wait:
        description: 'Wait for the build to finish (uses runner minutes, but surfaces build failures here)'
        type: boolean
        default: false
      submit:
        description: 'Submit to the store after building (production profile only)'
        type: boolean
        default: false

concurrency:
  group: mobile-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: eas build (${{ inputs.platform }} / ${{ inputs.profile }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Set up EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: npm ci

      - name: Check the build is pointed at a real API
        run: |
          URL=$(node -e "const c=require('./eas.json');process.stdout.write(c.build['${{ inputs.profile }}'].env.EXPO_PUBLIC_API_URL||'')")
          echo "EXPO_PUBLIC_API_URL for '${{ inputs.profile }}': ${URL:-<unset>}"
          if [ -z "${URL}" ]; then
            echo "::error::eas.json has no EXPO_PUBLIC_API_URL for this profile. A standalone build would point at localhost and reach nothing."
            exit 1
          fi
          case "${URL}" in
            *sufara-api.onrender.com*)
              echo "::warning::eas.json still holds the placeholder Render URL. Replace it with your deployed API before shipping this build to anyone."
              ;;
          esac

      - name: Build
        env:
          # Consumed by app.config.ts so the CLI knows which EAS project this is.
          EAS_PROJECT_ID: ${{ vars.EAS_PROJECT_ID }}
        run: |
          eas build \
            --platform ${{ inputs.platform }} \
            --profile ${{ inputs.profile }} \
            --non-interactive \
            ${{ inputs.wait && '--wait' || '--no-wait' }}

      - name: Submit to store
        if: inputs.submit && inputs.profile == 'production'
        env:
          EAS_PROJECT_ID: ${{ vars.EAS_PROJECT_ID }}
        run: eas submit --platform ${{ inputs.platform }} --profile production --non-interactive --latest

      - name: Where to find the build
        run: |
          echo "### EAS build requested" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Platform: \`${{ inputs.platform }}\` · Profile: \`${{ inputs.profile }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Download it from <https://expo.dev/accounts/[your-account]/projects/sufara/builds> — the \`preview\` profile produces an APK you can install directly." >> "$GITHUB_STEP_SUMMARY"
