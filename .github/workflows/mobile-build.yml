name: Mobile build (EAS)

# Fires two ways:
#
# 1. Automatically on every push to main that touches the mobile app, so the
#    latest code always has a fresh preview APK waiting on Expo. Uses fixed
#    settings (android / preview / no wait / no submit) since a push has no
#    interactive inputs.
# 2. Manually via workflow_dispatch when you need a different platform, an
#    AAB, or a store submission.
#
# Concurrency is grouped so several fast pushes fold into one build slot.

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-build.yml'
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build'
        type: choice
        options: [android, ios, all]
        default: android
      profile:
        description: 'eas.json profile — preview produces an installable APK, production an AAB/IPA for the stores'
        type: choice
        options: [preview, production]
        default: preview
      submit:
        description: 'Submit to the store after building (production profile only)'
        type: boolean
        default: false

concurrency:
  # Coalesce rapid pushes so we don't queue N build slots for N commits.
  group: mobile-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: eas build (${{ inputs.platform || 'android' }} / ${{ inputs.profile || 'preview' }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    env:
      # workflow_dispatch inputs are empty strings on push events, so || picks
      # the fallback. These are the only values referenced below.
      PLATFORM: ${{ inputs.platform || 'android' }}
      PROFILE: ${{ inputs.profile || 'preview' }}
      SHOULD_SUBMIT: ${{ inputs.submit || 'false' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Set up EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: npm ci

      - name: Check the build is pointed at a real API
        run: |
          URL=$(node -e "const c=require('./eas.json');process.stdout.write(c.build['${PROFILE}'].env.EXPO_PUBLIC_API_URL||'')")
          echo "EXPO_PUBLIC_API_URL for '${PROFILE}': ${URL:-<unset>}"
          if [ -z "${URL}" ]; then
            echo "::error::eas.json has no EXPO_PUBLIC_API_URL for this profile. A standalone build would point at localhost and reach nothing."
            exit 1
          fi
          case "${URL}" in
            *sufara-api.onrender.com*)
              echo "::warning::eas.json still holds the placeholder Render URL. Replace it with your deployed API before shipping this build to anyone."
              ;;
          esac

      - name: Build (queue on EAS)
        id: build
        env:
          # Consumed by app.config.ts so the CLI knows which EAS project this is.
          EAS_PROJECT_ID: ${{ vars.EAS_PROJECT_ID }}
        run: |
          # Always --no-wait so we can poll separately with a bounded timeout
          # rather than tying up the runner if the EAS queue is backed up.
          RESULT=$(eas build \
            --platform "${PLATFORM}" \
            --profile "${PROFILE}" \
            --non-interactive \
            --no-wait \
            --json)
          BUILD_ID=$(echo "${RESULT}" | jq -r '.[0].id // empty')
          if [ -z "${BUILD_ID}" ]; then
            echo "::error::eas build returned no build id"
            echo "${RESULT}"
            exit 1
          fi
          echo "Build id: ${BUILD_ID}"
          echo "build_id=${BUILD_ID}" >> "$GITHUB_OUTPUT"

      - name: Poll EAS until the artifact URL exists
        # 40 attempts × 30s = 20 minutes. Enough for a typical preview APK on
        # the free tier; extends gracefully to a "check expo.dev" note if the
        # queue is unusually deep.
        env:
          EAS_PROJECT_ID: ${{ vars.EAS_PROJECT_ID }}
          BUILD_ID: ${{ steps.build.outputs.build_id }}
        run: |
          for attempt in $(seq 1 40); do
            sleep 30
            INFO=$(eas build:view "${BUILD_ID}" --non-interactive --json 2>/dev/null || echo '{}')
            STATUS=$(echo "${INFO}" | jq -r '.status // "unknown"')
            echo "attempt ${attempt}: status=${STATUS}"
            case "${STATUS}" in
              finished)
                URL=$(echo "${INFO}" | jq -r '.artifacts.buildUrl // .artifacts.applicationArchiveUrl // empty')
                if [ -z "${URL}" ]; then
                  echo "::warning::Build finished but no artifact URL — check https://expo.dev/accounts/[your-account]/projects/sufara/builds/${BUILD_ID}"
                  exit 0
                fi
                {
                  echo "## 📱 APK ready to install"
                  echo ""
                  echo "**[⬇️ Direct download](${URL})**"
                  echo ""
                  echo "- Platform: \`${PLATFORM}\` · Profile: \`${PROFILE}\`"
                  echo "- Build id: \`${BUILD_ID}\`"
                  echo "- Expo page: <https://expo.dev/accounts/[your-account]/projects/sufara/builds/${BUILD_ID}>"
                } >> "$GITHUB_STEP_SUMMARY"
                echo "APK_URL=${URL}"
                exit 0
                ;;
              errored|canceled)
                echo "::error::EAS build ${STATUS} — see https://expo.dev/accounts/[your-account]/projects/sufara/builds/${BUILD_ID}"
                exit 1
                ;;
            esac
          done
          {
            echo "## ⏳ Build still on EAS"
            echo ""
            echo "The build hasn't finished within 20 min — Expo's queue may be busy. Check <https://expo.dev/accounts/[your-account]/projects/sufara/builds/${BUILD_ID}> for the direct download link."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Submit to store
        if: env.SHOULD_SUBMIT == 'true' && env.PROFILE == 'production'
        env:
          EAS_PROJECT_ID: ${{ vars.EAS_PROJECT_ID }}
        run: eas submit --platform "${PLATFORM}" --profile production --non-interactive --latest
