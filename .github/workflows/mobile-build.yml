name: Mobile build (APK)

# Builds a standalone release APK on the GitHub-hosted runner using
# expo prebuild + Gradle — no EAS cloud builds, no monthly limits.
# Signs with the Android debug keystore (pre-installed on every runner)
# so the APK installs without a Metro bundler or dev server.
# On success, publishes a GitHub Release with the APK attached.

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-build.yml'
  workflow_dispatch:

permissions:
  contents: write   # required to create GitHub Releases

concurrency:
  group: mobile-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK (release)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android SDK licences
        run: yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

      - name: Install JS dependencies
        run: npm ci

      - name: Expo prebuild — generate Android native project
        env:
          EAS_PROJECT_ID: ${{ vars.EAS_PROJECT_ID }}
          EXPO_PUBLIC_API_URL: https://sufara-api-0a1u.onrender.com/api/v1
        run: npx expo prebuild --platform android --no-install

      - name: Sign release build with the debug keystore
        # The Android SDK ships a debug.keystore on every machine.
        # Pointing the release buildType at it lets us produce a proper
        # release APK (no Metro, standalone JS bundle) that can be
        # sideloaded without needing a production signing certificate.
        working-directory: mobile/android
        run: |
          KEYSTORE="$HOME/.android/debug.keystore"
          # Generate it if somehow missing (shouldn't be, but safe)
          if [ ! -f "${KEYSTORE}" ]; then
            keytool -genkey -v \
              -keystore "${KEYSTORE}" \
              -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          # Append a keystore.properties file the Gradle script will pick up
          cat > keystore.properties << EOF
          storeFile=${KEYSTORE}
          storePassword=android
          keyAlias=androiddebugkey
          keyPassword=android
          EOF

          # Patch app/build.gradle to load keystore.properties and use it
          # for the release signing config (idempotent — only adds if not present)
          if ! grep -q 'keystore.properties' app/build.gradle; then
            python3 - << 'PYEOF'
          import re, pathlib

          gradle = pathlib.Path('app/build.gradle').read_text()

          # 1. Load keystore.properties at the top of the android {} block
          props_snippet = '''
              def keystorePropsFile = rootProject.file("keystore.properties")
              def keystoreProps = new Properties()
              if (keystorePropsFile.exists()) { keystoreProps.load(new FileInputStream(keystorePropsFile)) }
          '''
          # 2. Add a signingConfigs block before buildTypes
          signing_snippet = '''
              signingConfigs {
                  release {
                      storeFile file(keystoreProps['storeFile'])
                      storePassword keystoreProps['storePassword']
                      keyAlias keystoreProps['keyAlias']
                      keyPassword keystoreProps['keyPassword']
                  }
              }
          '''
          # 3. Point the release buildType at the signing config
          gradle = re.sub(
              r'(buildTypes\s*\{[^}]*release\s*\{)',
              r'\1\n            signingConfig signingConfigs.release',
              gradle,
              count=1,
              flags=re.DOTALL,
          )

          # Insert props loader + signingConfigs just before buildTypes
          gradle = re.sub(
              r'(\s*buildTypes\s*\{)',
              props_snippet + signing_snippet + r'\1',
              gradle,
              count=1,
          )

          pathlib.Path('app/build.gradle').write_text(gradle)
          print('app/build.gradle patched ✓')
          PYEOF
          fi

      - name: Build release APK
        working-directory: mobile/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon -x test

      - name: Locate APK and set outputs
        id: apk
        run: |
          APK=$(find android/app/build/outputs/apk/release -name "*.apk" | head -1)
          if [ -z "${APK}" ]; then
            echo "::error::No APK found after build"
            exit 1
          fi
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          DATE=$(date +%Y%m%d)
          echo "path=${APK}" >> "$GITHUB_OUTPUT"
          echo "tag=v1.0-${DATE}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "title=Sufara Android ${DATE} (${SHORT_SHA})" >> "$GITHUB_OUTPUT"
          echo "Built APK: ${APK}"

      - name: Create GitHub Release and upload APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NOTES="## Sufara Android APK

          Standalone release APK — sideload on any Android device.

          **Install steps:**
          1. Download \`sufara.apk\` below
          2. Open it on your Android device
          3. If prompted, enable *Install from unknown sources* for your browser/Files app
          4. Tap Install

          | | |
          |---|---|
          | **API** | https://sufara-api-0a1u.onrender.com/api/v1 |
          | **Commit** | \`${{ github.sha }}\` |
          | **Built** | $(date -u +'%Y-%m-%d %H:%M UTC') |"

          gh release create "${{ steps.apk.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --title "${{ steps.apk.outputs.title }}" \
            --notes "${NOTES}" \
            --latest \
            "${{ steps.apk.outputs.path }}#sufara.apk"

          RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/${{ steps.apk.outputs.tag }}"
          echo "✅ GitHub Release: ${RELEASE_URL}"
          {
            echo "## 📱 APK ready"
            echo ""
            echo "**[⬇️ Download sufara.apk](${RELEASE_URL})**"
            echo ""
            echo "Standalone release build — no dev server needed."
          } >> "$GITHUB_STEP_SUMMARY"
